name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main  # Only run on push to main (after PR merge)

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race -timeout 2m -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  api-contract:
    name: API Contract
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      # Starts a real overwatch in-process, calls every operation in
      # api/openapi.yaml and validates the responses against the spec.
      - name: Validate API responses against api/openapi.yaml
        run: go test -race -count=1 -run 'TestAPIContract' -v ./cmd/opengslb

  # Runs the Overlord portal's contract tests against the overwatch built from
  # this pull request, so a Go or spec change that breaks Overlord fails here.
  # Overlord is a private repository: this job needs a repository secret
  # OVERLORD_REPO_TOKEN with read access to LoganRossUS/Overlord. Pull requests
  # from forks cannot read secrets and skip the job.
  overlord-contract:
    name: Overlord Contract
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build overwatch image from this pull request
        run: docker build -t opengslb:pr .

      # Use the Overlord branch with the same name as this pull request's
      # branch if it exists, otherwise Overlord's default branch.
      - name: Resolve paired Overlord branch
        id: overlord
        env:
          HEAD_REF: ${{ github.head_ref }}
          OVERLORD_REPO_TOKEN: ${{ secrets.OVERLORD_REPO_TOKEN }}
        run: |
          if [ -z "$OVERLORD_REPO_TOKEN" ]; then
            echo "::error::Secret OVERLORD_REPO_TOKEN is not set. It must grant read access to LoganRossUS/Overlord."
            exit 1
          fi
          remote="https://x-access-token:${OVERLORD_REPO_TOKEN}@github.com/LoganRossUS/Overlord.git"
          if git ls-remote --exit-code --heads "$remote" "refs/heads/${HEAD_REF}" > /dev/null 2>&1; then
            echo "ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"
            echo "Using paired Overlord branch: ${HEAD_REF}"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
            echo "No Overlord branch named ${HEAD_REF}; using Overlord's default branch"
          fi

      - name: Checkout Overlord
        uses: actions/checkout@v4
        with:
          repository: LoganRossUS/Overlord
          ref: ${{ steps.overlord.outputs.ref }}
          token: ${{ secrets.OVERLORD_REPO_TOKEN }}
          path: overlord
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: overlord/package-lock.json

      - name: Install Overlord dependencies
        working-directory: overlord
        run: npm ci

      # Type-check Overlord against this pull request's spec, not its vendored copy.
      - name: Check Overlord against this pull request's spec
        working-directory: overlord
        env:
          OPENGSLB_SPEC: ${{ github.workspace }}/api/openapi.yaml
        run: |
          npm run spec:sync
          npm run spec:generate
          npm run typecheck

      - name: Run Overlord contract tests against this pull request's overwatch
        working-directory: overlord
        env:
          OPENGSLB_IMAGE: opengslb:pr
        run: npm run test:contract

  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build
        run: go build -v ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... || true

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build]  # Only run if build succeeds
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build OpenGSLB binary
        run: go build -o opengslb ./cmd/opengslb

      - name: Start test environment
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for backend services..."
          sleep 10
          # Verify backends are responding
          for ip in 172.28.0.2 172.28.0.3 172.28.0.4; do
            curl -sf http://$ip/ > /dev/null && echo "Backend $ip is ready" || echo "Backend $ip not ready"
          done

      - name: Run integration tests
        env:
          GSLB_BINARY: ${{ github.workspace }}/opengslb
        run: go test -tags=integration -v -timeout=5m ./test/integration/...

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== Docker Compose Logs ==="
          docker compose -f docker-compose.test.yml logs
          echo "=== OpenGSLB Log ==="
          cat /tmp/opengslb-*.log 2>/dev/null || echo "No OpenGSLB logs found"

      - name: Stop test environment
        if: always()
        run: docker compose -f docker-compose.test.yml down -v