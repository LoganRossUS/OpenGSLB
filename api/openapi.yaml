      description: '`service` is required in effect: a request that names the domain in none of `service`,
        `metadata.service` and `name` returns 400.'
    ServerHealthCheck:
      type: object
      required:
      - enabled
      - type
      - interval
      - timeout
      - healthy_threshold
      - unhealthy_threshold
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False when the overwatch does not probe the server, because the check was turned off for it
            or because external validation is turned off on the node.
        type:
          type: string
          enum:
          - http
          - https
          - tcp
        path:
          type: string
          description: Request path of an http or https check. Absent for tcp.
        host:
          type: string
          description: Host header and TLS server name of an http or https check. Absent when not set.
        interval:
          $ref: '#/components/schemas/Duration'
        timeout:
          $ref: '#/components/schemas/Duration'
        healthy_threshold:
          type: integer
          description: Consecutive passing checks before the server counts as healthy.
        unhealthy_threshold:
          type: integer
          description: Consecutive failed checks before the server counts as unhealthy.
      description: The health check in effect for a server. Every field holds the value the overwatch uses.
    ServerHealthCheckRequest:
      type: object
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: False turns external validation off for this server.
        type:
          type: string
          enum:
          - http
          - https
          - tcp
        path:
          type: string
          description: Must start with `/`. Not allowed with type tcp.
        host:
          type: string
          description: Not allowed with type tcp.
        interval:
          $ref: '#/components/schemas/Duration'
        timeout:
          $ref: '#/components/schemas/Duration'
        healthy_threshold:
          type: integer
          minimum: 1
          maximum: 100
        unhealthy_threshold:
          type: integer
          minimum: 1
          maximum: 100
      description: 'A health check as a client sends it. Every field is optional; a field that is left out uses the
        node-wide setting (`overwatch.validation`), or keeps its value in a partial update. Nothing is ignored:
        an unknown field (for example `expected_status`), an unknown type, a number in place of a duration
        string, `interval` outside 1s to 1h, `timeout` outside 100ms to 1m and a timeout longer than the
        interval are all rejected with 400. On an overwatch whose external validation is turned off
        (`overwatch.validation.enabled: false`) a check other than `{"enabled": false}` returns 409.'
    ServerHealthCheckResponse:
      type: object
      required:
      - server_id
      - health_check
      additionalProperties: false
      properties:
        server_id:
          type: string
        health_check:
          $ref: '#/components/schemas/ServerHealthCheck'
