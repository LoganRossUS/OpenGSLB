# OpenGSLB Overwatch REST API contract.
# SPDX-License-Identifier: AGPL-3.0-or-later OR LicenseRef-OpenGSLB-Commercial
#
# Single source of truth for the API. Edit this file first, then the Go handler,
# then the Overlord client. See docs/api-alignment.md.

openapi: 3.1.0
info:
  title: OpenGSLB Overwatch API
  version: 1.0.0
  description: |-
    REST API served by an OpenGSLB overwatch node (`pkg/api`, routes in `pkg/api/server.go`).

    This file is the single source of truth for the API. `docs/api.md` is generated from it, the
    contract test (`cmd/opengslb/api_contract_test.go`) validates the running server against it, and the
    Overlord portal generates its client types from it.

    It describes what the binary does today, including behavior that is wrong. Operations carry an
    `x-status` extension when they are not fully real:

    | x-status | Meaning |
    |----------|---------|
    | *(absent)* | Real: backed by live node state. |
    | `stub` | Returns placeholder, hard-coded or always-empty data. |
    | `not-implemented` | The handler exists but its provider always fails, so no success response is ever returned. |
    | `unavailable` | Registered, but a dependency is never wired by `cmd/opengslb`, so it always answers 503. |
    | `unwired` | The handler exists but `cmd/opengslb` never attaches it, so the path answers 404. |
    | `broken` | Unreachable because of a routing defect. |

    There is no authentication and no TLS. Access control is an IP allowlist (`api.allowed_networks`,
    loopback only by default); a rejected client gets 403 with the plain-text body `Forbidden`.

    Errors are `{"error": string, "code": int}`. Timestamps are RFC 3339. A Go zero time is serialized as
    `0001-01-01T00:00:00Z` rather than omitted.

    Durations (health-check `interval` and `timeout`) are strings in Go duration syntax with a unit, such as
    `"30s"`, `"500ms"` or `"1m30s"`, the form the configuration file uses. A bare number is rejected with
    400: earlier versions decoded it as nanoseconds while clients meant seconds.

    Servers and backends are one model. A server is one backend of one domain: the object returned under
    `/api/v1/servers` and under `/api/v1/domains/{name}/backends` is the same `BackendServer`, whatever
    endpoint created it, and its `service` field is the name of its domain. Its `source` says who owns it:
    `static` (configuration file), `agent` (registered by an agent over gossip) or `api`. Only `api`
    servers can be changed through the API.

    Writes need the persistent store (`overwatch.data_dir`). An overwatch that could not create its store
    starts read-only: every request that creates, changes or deletes a domain, server or region is answered
    with 503 and a message that names the directory, and nothing is changed.
  license:
    name: AGPL-3.0-or-later OR LicenseRef-OpenGSLB-Commercial
servers:
- url: http://localhost:8080
  description: Overwatch API listener (`api.address`).
tags:
- name: Discovery
- name: Probes
- name: Health
- name: Domains
- name: Servers
- name: Regions
- name: Overrides
- name: Geo
- name: Overwatch
- name: Nodes
- name: Gossip
- name: Audit
- name: Metrics
- name: Config
- name: Routing
- name: DNSSEC
paths:
  /api:
    get:
      operationId: getApiRoot
      tags:
      - Discovery
      summary: List API versions
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIVersionResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/health:
    get:
      operationId: getSimpleHealth
      tags:
      - Discovery
      summary: Simple health check
      description: Handler exists and `pkg/api/server.go` registers the route only when the handler is attached;
        `cmd/opengslb` never attaches it, so the running binary answers 404.
      x-status: unwired
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleHealthResponse'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1:
    get:
      operationId: getV1Root
      tags:
      - Discovery
      summary: List v1 endpoint groups
      description: Also the catch-all for any unregistered `/api/v1/...` path, which returns 404 `not found`.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDiscoveryResponse'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/health:
    get:
      operationId: getHealthRoot
      tags:
      - Discovery
      summary: List health endpoints
      description: Discovery listing only. This is not a health or status document.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDiscoveryResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/geo:
    get:
      operationId: getGeoRoot
      tags:
      - Discovery
      summary: List geolocation endpoints
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDiscoveryResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/overwatch:
    get:
      operationId: getOverwatchRoot
      tags:
      - Discovery
      summary: List overwatch endpoints
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDiscoveryResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/cluster:
    get:
      operationId: getClusterRoot
      tags:
      - Discovery
      summary: List cluster endpoints
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIDiscoveryResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/version:
    get:
      operationId: getVersion
      tags:
      - Discovery
      summary: Build and version information
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/live:
    get:
      operationId: getLive
      tags:
      - Probes
      summary: Liveness probe
      description: Not subject to the IP allowlist.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveResponse'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/ready:
    get:
      operationId: getReady
      tags:
      - Probes
      summary: Readiness probe
      description: Not subject to the IP allowlist.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
        '405':
          $ref: '#/components/responses/Error405'
        '503':
          description: Dependency not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
  /api/v1/health/servers:
    get:
      operationId: getHealthServers
      tags:
      - Health
      summary: Health of every health-checked server
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/health/regions:
    get:
      operationId: getHealthRegions
      tags:
      - Health
      summary: Health aggregated by region
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegionsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/overwatch/backends:
    get:
      operationId: listOverwatchBackends
      tags:
      - Overwatch
      summary: List backends in the registry
      parameters:
      - name: service
        in: query
        required: false
        schema:
          type: string
      - name: region
        in: query
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        schema:
          type: string
        description: 'Effective status: healthy, unhealthy or stale.'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/overwatch/backends/{service}/{address}/{port}/override:
    post:
      operationId: setBackendOverride
      tags:
      - Overwatch
      summary: Force a backend healthy or unhealthy
      description: The `X-User` request header is recorded as the override author (default `api`).
      parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: address
        in: path
        required: true
        schema:
          type: string
      - name: port
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BackendOverrideRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendOverrideResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
    delete:
      operationId: clearBackendOverride
      tags:
      - Overwatch
      summary: Clear a backend override
      parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: address
        in: path
        required: true
        schema:
          type: string
      - name: port
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendOverrideResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/overwatch/stats:
    get:
      operationId: getOverwatchStats
      tags:
      - Overwatch
      summary: Backend statistics
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/overwatch/validate:
    post:
      operationId: triggerValidation
      tags:
      - Overwatch
      summary: Trigger external validation now
      description: With `service`, `address` and `port` all set, validates one backend; otherwise all backends.
      parameters:
      - name: service
        in: query
        required: false
        schema:
          type: string
      - name: address
        in: query
        required: false
        schema:
          type: string
      - name: port
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/overwatch/latency:
    get:
      operationId: getLatencyTable
      tags:
      - Overwatch
      summary: Learned latency table (ADR-017)
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatencyTableResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
    post:
      operationId: injectLatency
      tags:
      - Overwatch
      summary: Inject a latency sample (test aid)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LatencyInjectRequest'
      responses:
        '201':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LatencyInjectResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/overwatch/agents:
    get:
      operationId: listAgentCerts
      tags:
      - Overwatch
      summary: List pinned agent certificates
      description: '`cmd/opengslb` never calls `SetAgentAuth`, so the running binary always answers 503 `agent auth
        not configured`.'
      x-status: unavailable
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCertsResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/overwatch/agents/expiring:
    get:
      operationId: listExpiringAgentCerts
      tags:
      - Overwatch
      summary: List agent certificates close to expiry
      description: '`cmd/opengslb` never calls `SetAgentAuth`, so the running binary always answers 503 `agent auth
        not configured`.'
      x-status: unavailable
      parameters:
      - name: threshold_days
        in: query
        required: false
        schema:
          type: string
        description: Default 30.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentsExpiringResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/overwatch/agents/{agent_id}:
    get:
      operationId: getAgentCert
      tags:
      - Overwatch
      summary: Get one pinned agent certificate
      description: '`cmd/opengslb` never calls `SetAgentAuth`, so the running binary always answers 503 `agent auth
        not configured`.'
      x-status: unavailable
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCertResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    delete:
      operationId: deleteAgentCert
      tags:
      - Overwatch
      summary: Delete a pinned agent certificate
      description: '`cmd/opengslb` never calls `SetAgentAuth`, so the running binary always answers 503 `agent auth
        not configured`.'
      x-status: unavailable
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/overwatch/agents/{agent_id}/revoke:
    post:
      operationId: revokeAgentCert
      tags:
      - Overwatch
      summary: Revoke an agent certificate
      description: '`cmd/opengslb` never calls `SetAgentAuth`, so the running binary always answers 503 `agent auth
        not configured`.'
      x-status: unavailable
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /api/v1/cluster/status:
    get:
      operationId: getClusterStatus
      tags:
      - Overwatch
      summary: Cluster status for deployment validation
      description: '`cmd/opengslb` never calls `SetClusterProvider`, so `overwatch.node_id` is empty and `overwatch.uptime_seconds`
        and `gossip_members` are always 0. Static (config-file) backends appear as one agent with an empty `agent_id`.'
      parameters:
      - name: expected_agents
        in: query
        required: false
        schema:
          type: string
        description: When set, cluster_healthy is false if fewer agents are healthy.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClusterStatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/overrides:
    get:
      operationId: listOverrides
      tags:
      - Overrides
      summary: List external health overrides
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverridesListResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/overrides/{service}/{address}:
    get:
      operationId: getOverride
      tags:
      - Overrides
      summary: Get one override
      parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: address
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Override'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
    put:
      operationId: setOverride
      tags:
      - Overrides
      summary: Set an override
      description: '`{address}` is stored as given; it is not checked against known servers.'
      parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: address
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OverrideResponse'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
    delete:
      operationId: clearOverride
      tags:
      - Overrides
      summary: Clear an override
      parameters:
      - name: service
        in: path
        required: true
        schema:
          type: string
      - name: address
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No content.
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
        '500':
          $ref: '#/components/responses/Error500'
  /api/v1/dnssec:
    get:
      operationId: getDnssecRoot
      tags:
      - DNSSEC
      summary: DNSSEC status (alias of /dnssec/status)
      description: Handler exists and `pkg/api/server.go` registers the route only when the handler is attached;
        `cmd/opengslb` never attaches it, so the running binary answers 404.
      x-status: unwired
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSSECStatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/dnssec/status:
    get:
      operationId: getDnssecStatus
      tags:
      - DNSSEC
      summary: DNSSEC status
      description: Handler exists and `pkg/api/server.go` registers the route only when the handler is attached;
        `cmd/opengslb` never attaches it, so the running binary answers 404.
      x-status: unwired
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSSECStatusResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/dnssec/ds:
    get:
      operationId: getDnssecDs
      tags:
      - DNSSEC
      summary: DS records for the parent zone
      description: Handler exists and `pkg/api/server.go` registers the route only when the handler is attached;
        `cmd/opengslb` never attaches it, so the running binary answers 404.
      x-status: unwired
      parameters:
      - name: zone
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DSResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/dnssec/keys:
    get:
      operationId: getDnssecKeys
      tags:
      - DNSSEC
      summary: DNSSEC keys
      description: Handler exists and `pkg/api/server.go` registers the route only when the handler is attached;
        `cmd/opengslb` never attaches it, so the running binary answers 404.
      x-status: unwired
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DNSSECKeysResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/Error404'
        '405':
          $ref: '#/components/responses/Error405'
  /api/v1/dnssec/sync:
    post:
      operationId: triggerDnssecSync
      tags:
