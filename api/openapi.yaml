components:
  responses:
    Forbidden:
      description: 'Client address is not in `api.allowed_networks` (default: loopback only). The body is the plain
        text `Forbidden`.'
      content:
        text/plain:
          schema:
            type: string
    Error400:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error404:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error405:
      description: Method not allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error409:
      description: 'Conflict: the object exists already, or it is owned by the configuration file or by an agent
        and cannot be changed through the API.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error500:
      description: Internal error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Error503:
      description: Dependency not configured. For a request that writes, also returned when the overwatch runs
        without its persistent store (`overwatch.data_dir` is not writable); the message names the directory
        and nothing was changed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    APIDiscoveryResponse:
      type: object
      required:
      - endpoints
      - generated_at
      additionalProperties: false
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/APIEndpoint'
        generated_at:
          type: string
          format: date-time
    APIEndpoint:
      type: object
      required:
      - path
      - description
      additionalProperties: false
      properties:
        path:
          type: string
        description:
          type: string
        methods:
          type: array
          items:
            type: string
    APIVersionResponse:
      type: object
      required:
      - versions
      - generated_at
      additionalProperties: false
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/APIEndpoint'
        generated_at:
          type: string
          format: date-time
    ActorActivityCount:
      type: object
      required:
      - actor
      - count
      additionalProperties: false
      properties:
        actor:
          type: string
        count:
          type: integer
    AgentCertResponse:
      type: object
      required:
      - agent_id
      - fingerprint
      - region
      - first_seen
      - last_seen
      - not_after
      - revoked
      - revoked_at
      - expires_in_hours
      additionalProperties: false
      properties:
        agent_id:
          type: string
        fingerprint:
          type: string
        region:
          type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        not_after:
          type: string
          format: date-time
        revoked:
          type: boolean
        revoked_at:
          type: string
          format: date-time
        revoked_reason:
          type: string
        expires_in_hours:
          type: integer
